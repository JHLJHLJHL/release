<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JHL 앱배포 페이지</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" data-nav></header>
  <main data-main></main>
  <footer class="foot" data-foot></footer>
  <script src="site.js"></script>
  <script src="apps-data.js"></script>
  <script>
    renderChrome("apps", "apps.html");
    const main = document.querySelector("[data-main]");
    const id = new URLSearchParams(location.search).get("id");
    const app = window.APPS.find((a) => a.id === id);

    if (!app) {
      main.innerHTML = `<section class="detail-hero wrap"><h1>앱을 찾지 못했습니다</h1>
        <div class="actions"><a class="btn btn-dark" href="apps.html">앱 목록으로</a></div></section>`;
    } else {
      const fmt = (d) => d.replaceAll("-", ". ") + ".";
      const primary = !app.url
        ? `<span class="btn btn-accent btn-lg" aria-disabled="true">${ICON.download}${esc(app.buttonLabel || "곧 공개합니다")}</span>`
        : app.kind === "link"
        ? `<a class="btn btn-accent btn-lg" href="${app.url}" target="_blank" rel="noopener">${ICON.open}${esc(app.buttonLabel || "웹에서 열기")}</a>`
        : `<a class="btn btn-accent btn-lg" href="${app.url}"${app.downloadName ? ` download="${esc(app.downloadName)}"` : ""}>${ICON.download}${esc(app.buttonLabel || "내려받기")}</a>`;
      const top = (app.topButtons || [])
        .map((b) => `<div class="actions"><a class="btn btn-accent btn-lg" href="${b.url}" target="_blank" rel="noopener">${ICON.open}${esc(b.label)}</a></div>`)
        .join("");
      const repo = app.repo
        ? `<a class="btn btn-dark btn-lg" href="${app.repo}" target="_blank" rel="noopener">${ICON.github}GitHub</a>`
        : "";
      const meta = [
        ["무료", app.version && `버전 ${app.version}`, app.size].filter(Boolean).join(" · "),
        app.platform + (app.audience === "teacher" ? " · 교사용" : " · 누구나"),
        app.updated && `${fmt(app.updated)} 업데이트`,
      ].filter(Boolean);

      main.innerHTML = `
        <div class="wrap back-row"><a class="back" href="apps.html">${ICON.back}앱 목록</a></div>
        <section class="detail-hero">
          <div class="wrap">
            ${icon(app, 128, "icon-lg")}
            <h1>${esc(app.name)}</h1>
            <p class="tagline">${esc(app.tagline)}</p>
            ${app.description ? `<p class="desc">${esc(app.description)}</p>` : ""}
            ${top}
            <div class="actions">${primary}${repo}</div>
            <ul class="meta">${meta.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
          </div>
        </section>
        ${app.noShots ? "" : `<div class="gallery">
          <div class="shots" tabindex="0" aria-label="화면 미리보기, 좌우 방향키로 넘기기">
            ${[1, 2, 3].map((n) => `<img src="assets/${app.id}/screenshot-0${n}.png" alt="${esc(app.name)} 화면 ${n}">`).join("")}
          </div>
          <button class="shot-nav shot-prev" type="button" aria-label="이전 화면" data-step="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
          <button class="shot-nav shot-next" type="button" aria-label="다음 화면" data-step="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
          <div class="dots">${[0, 1, 2].map((i) => `<button class="dot" type="button" aria-label="화면 ${i + 1}" data-go="${i}"></button>`).join("")}</div>
        </div>`}
        <div class="wrap">
          ${app.features?.length ? `<div class="features">
            ${app.features.map(([t, d]) => `<div class="feature"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}
          </div>` : ""}
          ${app.requires?.length ? `<div class="requires">
            <h2>필요한 것</h2>
            <ul>${app.requires.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
          </div>` : ""}
          <div class="back-bottom"><a class="back" href="apps.html">${ICON.back}앱 목록</a></div>
        </div>`;

      const shots = main.querySelector(".shots");
      if (shots) {
        const count = shots.children.length;
        const current = () => Math.round(shots.scrollLeft / shots.clientWidth);
        const go = (i) => shots.scrollTo({ left: Math.max(0, Math.min(count - 1, i)) * shots.clientWidth });
        const sync = () => {
          const i = current();
          main.querySelectorAll(".dot").forEach((d, n) => d.setAttribute("aria-current", String(n === i)));
          main.querySelector(".shot-prev").disabled = i === 0;
          main.querySelector(".shot-next").disabled = i === count - 1;
        };
        main.querySelectorAll(".shot-nav").forEach((b) => b.addEventListener("click", () => go(current() + Number(b.dataset.step))));
        main.querySelectorAll(".dot").forEach((d) => d.addEventListener("click", () => go(Number(d.dataset.go))));
        shots.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            e.preventDefault();
            go(current() + (e.key === "ArrowRight" ? 1 : -1));
          }
        });
        shots.addEventListener("scroll", sync, { passive: true });
        sync();
      }
    }
  </script>
</body>
</html>
